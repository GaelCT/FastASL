name: CI

on:
  push:
    branches: [main, "reboot/**"]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Lint and test (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Check (lint + tests)
        run: npm run check
