name: CI

on:
  push:
    branches: [main, node, "reboot/**"]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Lint and test (Node 24)
    runs-on: ubuntu-latest
    services:
      mysql:
        # Reviewed MySQL 8.4.9 LTS server and image manifest.
        image: mysql:8.4.9@sha256:c36050afdca850f23cef85703f84c7531a5ae155a11b5ee1c60acb09937c4084
        env:
          MYSQL_DATABASE: fastasl_test
          MYSQL_USER: fastasl_test
          MYSQL_PASSWORD: ci-application-only
          MYSQL_ROOT_PASSWORD: ci-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=localhost --user=root --password=$${MYSQL_ROOT_PASSWORD} --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s
        # Keep the database clock deterministic rather than using the host zone.
        command: mysqld --default-time-zone=+00:00
    env:
      NODE_ENV: test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: fastasl_test
      MYSQL_USER: fastasl_test
      MYSQL_PASSWORD: ci-application-only
      MYSQL_CONNECTION_LIMIT: "2"
      MYSQL_TEST_ALLOW_DESTRUCTIVE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Check (lint + unit/integration + real MySQL)
        run: npm run check
