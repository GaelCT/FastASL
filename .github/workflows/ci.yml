name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  permissions-linux:
    name: Permission and release checks (H-13 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare documented runtime paths
        run: mkdir -p var/log var/cache/leaderboard var/cache/ratelimit && chmod 0750 var var/log var/cache var/cache/leaderboard var/cache/ratelimit
      - name: Validate source and runtime permissions
        run: bash scripts/check-permissions.sh
      - name: Run permission and ZIP negative fixtures
        run: python3 scripts/permission-policy.py self-test
      - name: Build actual release ZIP
        run: python3 scripts/permission-policy.py build-release --output dist/fastasl-release.zip
      - name: Validate stored ZIP metadata
        run: python3 scripts/permission-policy.py validate-zip --zip dist/fastasl-release.zip
      - name: Extract and validate release ZIP
        run: python3 scripts/permission-policy.py extract-validate --zip dist/fastasl-release.zip

  permissions-windows:
    name: Permission checks (H-13 Windows ACL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SID ACL regression fixtures
        shell: pwsh
        run: ./scripts/check-permissions.ps1 -SelfTest
      - name: Validate repository ACLs
        shell: pwsh
        run: ./scripts/check-permissions.ps1

  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: parallel-lint
      - name: Check PHP syntax
        run: parallel-lint backend/ public/

  phpunit:
    name: PHPUnit unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run unit and integration tests
        run: vendor/bin/phpunit

  phpstan:
    name: PHPStan static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --level=1 backend/ public/ --no-progress

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Verify MediaPipe SRI and public HTML event handlers
        run: npm run test:frontend-security

  openapi:
    name: OpenAPI validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate OpenAPI
        run: npx @redocly/cli lint backend/openapi.yaml

  apache-exposure:
    name: Apache exposure smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install browser-test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Create non-index PHP test files
        run: |
          mkdir -p public/nested
          printf '<?php echo "LEAK"; ?>\n' > public/debug.php
          printf '<?php echo "LEAK"; ?>\n' > public/nested/index.php
          printf '<?php echo "LEAK"; ?>\n' > public/INDEX.PHP
          printf '<?php echo "LEAK"; ?>\n' > public/exposure-canary.sql
      - name: Prepare runtime directories and .env
        run: |
          mkdir -p "$RUNNER_TEMP/var/log" "$RUNNER_TEMP/var/cache"
          cp .env.example "$RUNNER_TEMP/env"
      - name: Start PHP-enabled Apache with production .htaccess
        run: |
          # First, pull the image to ensure we have the exact digest
          docker pull php:8.2-apache@sha256:bf518c4a303e5574b967201f22228f2f39e214afd23dcd6d58c965bc3c008086
          docker run -d --name apache-test \
            --init \
            -v "$GITHUB_WORKSPACE/public:/var/www/html:ro" \
            -v "$GITHUB_WORKSPACE/backend:/var/www/backend:ro" \
            -v "$RUNNER_TEMP/env:/var/www/.env:ro" \
            -v "$RUNNER_TEMP/var:/var/www/var" \
            -v "$GITHUB_WORKSPACE/.github/apache-test/htaccess.conf:/etc/apache2/conf-enabled/zz-htaccess.conf:ro" \
            -v "$GITHUB_WORKSPACE/.github/apache-test/headers.load:/etc/apache2/mods-enabled/headers.load:ro" \
            -p 8080:80 \
            php:8.2-apache@sha256:bf518c4a303e5574b967201f22228f2f39e214afd23dcd6d58c965bc3c008086 \
            bash -c "chown -R www-data:www-data /var/www/var && a2enmod rewrite >/dev/null && exec apache2-foreground"
      - name: Verify exposure rules
        run: |
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/login.html || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "Apache did not become ready (last: $code)"; docker logs apache-test 2>&1 || true; exit 1; }
          check_denied() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$1" || true)
            case "$code" in 403|404) return 0 ;; esac
            echo "FAIL: $1 returned $code (expected 403 or 404)"
            exit 1
          }
          check_denied /debug.php
          check_denied /nested/index.php
          check_denied /INDEX.PHP
          check_denied /Index.Php
          check_denied /index.php/extra
          check_denied /exposure-canary.sql
          verify_no_php_source() {
            path="$1"
            expected_code="$2"
            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS \
              -D "$headers" \
              -o "$body" \
              -w '%{http_code}' \
              "http://localhost:8080$path" || true)
            if [ "$code" != "$expected_code" ]; then
              echo "FAIL: $path returned $code; expected $expected_code"
              echo "--- headers ---"
              cat "$headers"
              echo "--- body ---"
              cat "$body"
              rm -f "$headers" "$body"
              exit 1
            fi
            if grep -Fqi '<?php' "$body"; then
              echo "FAIL: PHP source was disclosed by $path"
              cat "$body"
              rm -f "$headers" "$body"
              exit 1
            fi
            if ! grep -qi '^Content-Type: application/json' "$headers"; then
              echo "FAIL: $path did not return an application/json content type"
              cat "$headers"
              rm -f "$headers" "$body"
              exit 1
            fi
            rm -f "$headers" "$body"
          }
          verify_no_php_source /api 200
          verify_no_php_source /api/ 200
          verify_no_php_source /index.php 404
          health_body=$(curl -sS http://localhost:8080/api || true)
          printf '%s' "$health_body" | grep -Fq '"ASL Racer API"' || {
            echo "FAIL: /api did not return the expected health response"
            printf '%s\n' "$health_body"
            exit 1
          }
          echo "Apache exposure smoke test passed"

      - name: Verify static-page security headers
        run: scripts/test-static-security-headers.sh
      - name: Run browser static-page security regression
        run: npm run test:browser-security
