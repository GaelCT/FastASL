<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>American Sign Language (ASL) Racer | Fingerspelling Speed Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>

    <div id="auth-screen" class="screen active">
        <div class="container auth-container">
            <h1>ASL RACER</h1>
            <p class="subtitle">AUTHENTICATION GATEWAY</p>

            <div class="auth-panel ui-panel">
                <div class="form-group">
                    <input type="text" id="auth-username" class="ui-input full-width" placeholder="USERNAME / EMAIL">
                    <input type="password" id="auth-password" class="ui-input full-width" placeholder="PASSWORD">
                    <button id="login-button" class="action-btn full-width">SIGN IN</button>
                </div>
            </div>

            <div class="controls-info">
                <p>Protected connection architecture. Session verification managed on handshakes.</p>
            </div>
        </div>
    </div>

    <script src="/assets/js/login.js"></script>
</body>
</html>
