openapi: 3.0.0
info:
  title: ASL Racer API
  description: REST API for ASL Racer typing game
  version: 3.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost/backend
    description: Local development server

# Public API by default; protected operations override with bearerAuth
security: []

paths:
  /:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  version:
                    type: string

  /validate:
    post:
      summary: Validate username format
      operationId: validateUsername
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  pattern: '^[a-zA-Z0-9_]{3,8}$'
      responses:
        '200':
          description: Username is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  valid:
                    type: boolean
                  username:
                    type: string
        '400':
          description: Invalid username format

  /register:
    post:
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - name
                - password
              properties:
                username:
                  type: string
                  pattern: '^[a-zA-Z0-9_]{3,8}$'
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                password:
                  type: string
                  minLength: 6
                scope:
                  type: string
                  enum: [global, local, friends]
                  default: global
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      name:
                        type: string
        '400':
          description: Invalid input
        '409':
          description: Username already taken
        '429':
          description: Rate limit exceeded

  /login:
    post:
      summary: Authenticate user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      name:
                        type: string
                      token:
                        type: string
        '400':
          description: Invalid input
        '401':
          description: Invalid credentials
        '429':
          description: Rate limit exceeded

  /logout:
    post:
      summary: Logout user (invalidate token)
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          description: Invalid or expired token
        '500':
          description: Server error

  /refresh:
    post:
      summary: Refresh authentication token
      operationId: refreshToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
        '401':
          description: Invalid or expired token
        '500':
          description: Server error

  /check:
    get:
      summary: Check username availability
      operationId: checkUsername
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  available:
                    type: boolean
                  username:
                    type: string
        '400':
          description: Invalid username

  /leaderboard:
    get:
      summary: Get leaderboard
      operationId: getLeaderboard
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [global, local, friends]
            default: global
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        '200':
          description: Leaderboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        username:
                          type: string
                        name:
                          type: string
                        best_wpm:
                          type: integer
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer
        '400':
          description: Invalid parameters

  /score:
    post:
      summary: Submit race score
      operationId: submitScore
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - wpm
              properties:
                wpm:
                  type: integer
                  minimum: 1
                  maximum: 1000
      responses:
        '200':
          description: Score submitted
        '400':
          description: Invalid input
        '401':
          description: Invalid or expired token
        '415':
          description: Invalid Content-Type
        '500':
          description: Server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
